<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TriFoxie</title>
    <script src="baseFunctions.js"></script>
    <link rel="stylesheet" href="global.css">
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="profile">
    <img id="pfp" src="Assets/trix.png" alt=""/>
    <h1 id="name">TriFoxie</h1>
    <ul>
        <li>It's <script>document.currentScript.insertAdjacentText('beforebegin', getTime('Europe/London'));</script> (Europe/London)<br></li>
        <li>Age: 19</li>
        <li>UK</li>
    </ul>
    <div style="display: grid;place-items: center;">
        <div class="separator"></div>
    </div>
    <div>
        <div class="preferred-words">
            <h1>Names</h1>
            <ul>
                <li class="love"><iconify-icon icon="material-symbols:favorite-rounded" noobserver></iconify-icon> Bea</li>
                <li class="like"><iconify-icon icon="material-symbols:thumb-up" noobserver></iconify-icon> Beatrix</li>
                <li class="fine"><iconify-icon icon="material-symbols:face" noobserver></iconify-icon> Trix</li>
                <li class="goofy"><iconify-icon icon="material-symbols:comedy-mask" noobserver></iconify-icon> Bean</li>
            </ul>
        </div>
        <div class="preferred-words">
            <h1>Pronouns</h1>
            <ul>
                <li class="love"><iconify-icon icon="material-symbols:favorite-rounded" noobserver></iconify-icon> She/Her</li>
                <li class="goofy"><iconify-icon icon="material-symbols:comedy-mask" noobserver></iconify-icon> It/Its</li>
                <li class="dislike"><iconify-icon icon="material-symbols:thumb-down" noobserver></iconify-icon> They/Them</li>
            </ul>
        </div>
    </div>
    <div>⠀</div>
    <!--Unicode blank character don't touch it lol-->
    <div style="display: grid;place-items: center;">
        <div class="preferred-words-key">
            <p>
                <span class="love"><iconify-icon icon="material-symbols:favorite-rounded" noobserver></iconify-icon> = Yes</span>
                <span class="like"><iconify-icon icon="material-symbols:thumb-up" noobserver></iconify-icon> = Okay</span>
                <span class="fine"><iconify-icon icon="material-symbols:face" noobserver></iconify-icon> = I guess</span>
                <span class="goofy"><iconify-icon icon="material-symbols:comedy-mask" noobserver></iconify-icon> = For fun</span>
                <span class="dislike"><iconify-icon icon="material-symbols:thumb-down" noobserver></iconify-icon> = Nope</span>
            </p>
        </div>
    </div>
    <div style="display: grid;place-items: center;">
        <div class="separator"></div>
    </div>
</div>
</body>
</html>
